<!DOCTYPE html>
<html lang="id">

<style>

.nav-item:hover{background:#f7f8fa}.nav-item.selected{background:var(--red-soft);color:var(--red);font-weight:700}

.workspace{max-width:1480px;margin:auto;padding:28px 32px 40px}

.page-heading h1{font-size:26px;letter-spacing:-.9px;margin:0 0 4px}.page-heading p{font-size:14px;margin:0}

.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:17px 18px}
.stat-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#7b8191;gap:6px}.stat-top .icon{color:#a7acb7;width:18px}

.panel{background:#fff;border:1px solid var(--border);border-radius:14px}

.panel-body{padding:22px}
.sticky{position:sticky;top:48px}

.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dfe2e9;border-radius:8px;padding:10px 12px;background:#fff;min-height:44px;width:100%;font-size:16px}
.field textarea{min-height:80px;resize:vertical}.hint{font-size:12px;color:#9298a5;margin-top:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}
.qty-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qty-choice button{border:1px solid #dfe2e9;border-radius:10px;background:#fff;min-height:56px;font-size:20px;font-weight:750;line-height:1.1}
.qty-choice button small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.qty-choice button:hover{border-color:#e6b4bc;background:#fff6f7}
.qty-choice button[aria-pressed=true]{border-color:var(--red);background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.qty-choice button[aria-pressed=true] small{color:var(--red)}
.stepper button{border:1px solid #dfe2e9;border-radius:8px;background:#fff;font-size:22px;font-weight:600;min-height:48px}
.stepper button:hover{background:var(--red-soft);color:var(--red)}
.stepper input{text-align:center;font-size:20px!important;font-weight:700;min-height:48px!important}
.summary{display:flex;align-items:center;justify-content:space-between;background:#fff6f7;border:1px solid #efd8dc;border-radius:10px;padding:14px 16px;margin:4px 0 16px}
.summary span{font-size:13px;color:#7f6b72}.summary strong{font-size:22px;letter-spacing:-.5px;color:var(--red)}
.error{padding:10px 12px;border:1px solid #f0c9ce;color:#b52d3a;border-radius:8px;background:#fff5f6;font-size:13px;margin-bottom:14px}
.alert{border:1px solid #dae4fa;background:#f2f6ff;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:#5b7096;margin-bottom:16px}
.alert.warn{border-color:#f0d9ad;background:#fffbf2;color:#8f6c30}
/* Toolbar + table */
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}.search .icon{position:absolute;left:12px;top:12px;color:#9aa0ac}.search input{padding-left:40px}
.toolbar select{width:auto;font-size:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
th{font-weight:600;color:#969baa;background:#fcfcfd;font-size:11px;letter-spacing:.3px;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase}
td{padding:13px 12px;border-bottom:1px solid #f0f1f5;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}td .sub{font-size:11px;color:var(--muted);margin-top:2px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6d7484;letter-spacing:.3px;white-space:nowrap}td.c-nota strong{white-space:nowrap}.only-m{display:none}
.num{text-align:right;white-space:nowrap}
.actions{display:flex;gap:4px;justify-content:flex-end}
.pagination{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 22px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
.empty{text-align:center;padding:44px 20px}.empty .empty-icon{display:inline-grid;place-items:center;width:50px;height:50px;border:1px solid #f4dadd;background:#fff4f5;border-radius:14px;color:var(--red);margin-bottom:12px}
.empty h3{font-size:15px;margin-bottom:6px}.empty p{font-size:13px;color:#9297a3;max-width:320px;margin:0 auto}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:#141c3159;backdrop-filter:blur(3px);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:#fff;width:560px;max-width:100%;max-height:calc(100vh - 40px);overflow:auto;border-radius:18px;box-shadow:0 30px 90px #0d173135}
.modal.wide{width:760px}
.modal-head{padding:22px 24px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.modal-head h2{font-size:20px;margin:0 0 4px}.modal-head p{font-size:13px;margin:0;color:var(--muted)}
.close{background:none;border:0;color:#9095a2;font-size:24px;min-width:40px;min-height:40px;border-radius:8px}.close:hover{background:#f4f5f8}
.modal-body{padding:0 24px 24px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#283344;color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;box-shadow:0 9px 30px #1b243329;z-index:90;display:none;max-width:92vw;text-align:center}
/* Receipt */
.receipt-layout{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.paper-wrap{background:#eef0f4;border-radius:12px;padding:18px;display:flex;justify-content:center}
.paper{background:#fff;box-shadow:0 2px 10px #0000001a;padding:14px 12px}
.paper.w58{width:230px}.paper.w80{width:310px}
.code-card{border:1px dashed #dfb4bb;border-radius:9px;padding:14px;background:#fff9fa;margin:10px 0}
.code-card code{font-size:19px;font-weight:700;letter-spacing:1px;font-family:ui-monospace,Menlo,monospace}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 12px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
/* Thermal receipt content (shared by preview and print) */
.r{font-family:"Courier New",ui-monospace,monospace;font-size:11px;line-height:1.4;color:#000}
.r-center{text-align:center}.r-brand{font-size:15px;font-weight:700;margin-bottom:2px}
.r-row{display:flex;justify-content:space-between;gap:8px}.r-row span:first-child{white-space:nowrap}.r-row span:last-child{text-align:right}
.r hr{border:0;border-top:1px dashed #000;margin:6px 0}.r hr.double{border-top:3px double #000}
.r-total{font-weight:700;font-size:13px}.r-copy{text-align:center;font-weight:700;border:1px solid #000;margin:5px 0;padding:2px}
.r-label{font-weight:700;letter-spacing:1px;margin-top:4px}.r-code{text-align:center;font-size:17px;font-weight:700;letter-spacing:1px;margin:3px 0}
.r-qr{width:62%;margin:4px auto}.r-qr svg{width:100%;height:auto;display:block}
.r-note{text-align:center;font-size:10px}
#print-root{display:none}
/* Pratinjau aktivasi */
pre.json{background:#1f2533;color:#e3e7f0;border-radius:10px;padding:14px;font-size:12px;overflow:auto;margin:12px 0 0;white-space:pre-wrap}
/* Login */
.login-wrap{min-height:calc(100vh - 29px);display:grid;place-items:center;padding:24px}
.login-card{width:420px;max-width:100%;background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 20px 70px #28314b08}
.login-card h1{font-size:24px;letter-spacing:-.8px;margin:22px 0 6px}
.demo-accounts{display:grid;gap:8px;margin-top:18px}
.demo-acc{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:#fafbfc;font-size:13px;text-align:left;width:100%}
.demo-acc:hover{border-color:#e6b4bc;background:#fff6f7}
/* Settings */
.row-two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.user-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f1f5}.user-row:last-child{border-bottom:0}
.user-row b{font-size:14px;display:block}.user-row span{font-size:12px}
.help ol{padding-left:20px;margin:0 0 14px}.help li{font-size:14px;line-height:1.7;margin-bottom:6px;color:#4f5666}
.help h3{font-size:15px;margin:16px 0 8px}
/* Tablet */
@media(max-width:1099px){
 .sidebar{width:76px;padding:22px 12px;align-items:center}.sidebar .brand-text,.brand-sub,.nav-label,.nav-text,.shop-box{display:none}
 .sidebar .brand{margin-bottom:28px}.nav-item{justify-content:center;padding:12px}
 .main-shell{margin-left:76px}.workspace{padding:24px}.topbar{padding:0 24px}
 .content-grid{grid-template-columns:minmax(0,1fr)}.sticky{position:static}
 #sale-form .form-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
 .receipt-layout{grid-template-columns:1fr}
}
/* HP */
@media(max-width:899px){.stats{grid-template-columns:1fr 1fr}}
@media(max-width:759px){
 .only-m{display:inline}
 .sidebar{display:none}.main-shell{margin-left:0}
 .topbar{height:62px;padding:0 16px}.topbar .brand{display:flex;font-size:16px}.topbar .brand-mark{width:32px;height:34px;font-size:21px}.crumb{display:none}
 .top-actions .btn .btn-text{display:none}
 .workspace{padding:18px 14px 96px}.page-heading{align-items:flex-start}.page-heading h1{font-size:23px}.page-heading .date{display:none}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat-value{font-size:23px}.stat-value.money{font-size:17px}
 #sale-form .form-cols{display:block}.form-row{gap:10px}
 .panel-head,.toolbar,.panel-body{padding-left:16px;padding-right:16px}
 .toolbar .search{flex-basis:100%}.toolbar select{flex:1}
 table thead{display:none}table,tbody,tr,td{display:block;width:100%}
 tbody tr{padding:12px 16px;border-bottom:1px solid #eceef3;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
 td{padding:0;border:0}td.c-nota{grid-column:1}td.c-status{grid-column:2;text-align:right}
 td.c-buyer,td.c-qty{display:none}td.c-code{grid-column:1}td.c-total{grid-column:2;text-align:right;font-weight:700}
 td.c-act{grid-column:1/-1}.actions{justify-content:flex-start}
 .row-two{grid-template-columns:1fr}
 .bottom-nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bottom-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#7d8394;padding:6px 2px;border-radius:9px;min-height:52px}
 .bottom-nav button.selected{color:var(--red);font-weight:700;background:var(--red-soft)}
 .modal-backdrop{padding:10px;align-items:flex-end}.modal{max-height:calc(100dvh - 20px);border-radius:18px}
 .modal-head{padding:18px 18px 12px}.modal-body{padding:0 18px 20px}
 .modal-actions .btn{flex:1}
 #toast{bottom:84px}
}
@media print{
 html,body{background:#fff!important}
 body>*{display:none!important}
 body>#print-root{display:block!important}
 #print-root .thermal{padding:2mm 3mm;margin:0}
 #print-root .thermal.w58{width:48mm;padding:1mm 0;margin:0 auto}#print-root .thermal.w80{width:72mm;padding:1mm 0;margin:0 auto}
 #print-root .r-qr{width:72%}
 #print-root .r{font-size:8pt}#print-root .w80 .r{font-size:9.5pt}#print-root .r-code{font-size:13pt}#print-root .r-brand{font-size:11pt}#print-root .r-note{font-size:7pt}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.loading-screen{min-height:100vh;display:grid;place-items:center;text-align:center}
.spinner{width:30px;height:30px;border:3px solid #f3cdd0;border-top-color:var(--red);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
.spin-sm{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

<script>
/* QR encoder (versi 6, koreksi galat L, mode byte) — diambil dari referensi dosen. */
(function(root){
function multiply(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11d);z^=((y>>>i)&1)*x;}return z;}

function matrix(value){const bytes=new TextEncoder().encode(value);if(bytes.length>134)throw new Error('Isi QR terlalu panjang.');const bits=[];function add(n,len){for(let i=len-1;i>=0;i--)bits.push((n>>>i)&1);}
add(4,4);add(bytes.length,8);for(const b of bytes)add(b,8);add(0,Math.min(4,1088-bits.length));while(bits.length%8)bits.push(0);
const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>a*2+b,0));for(let pad=0;data.length<136;pad++)data.push(pad%2?0x11:0xec);
const blocks=[data.slice(0,68),data.slice(68)],ecc=blocks.map(b=>remainder(b,18)),words=[];for(let i=0;i<68;i++)for(const b of blocks)words.push(b[i]);for(let i=0;i<18;i++)for(const b of ecc)words.push(b[i]);
const size=41,m=Array.from({length:size},()=>Array(size).fill(false)),reserved=Array.from({length:size},()=>Array(size).fill(false));function set(x,y,v){m[y][x]=!!v;reserved[y][x]=true;}
for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
function finder(cx,cy){for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x>=0&&y>=0&&x<size&&y<size){const d=Math.max(Math.abs(dx),Math.abs(dy));set(x,y,d!==2&&d!==4);}}}
finder(3,3);finder(size-4,3);finder(3,size-4);
for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(34+dx,34+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
const format=0x77c4;const bit=i=>(format>>>i)&1;
for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));
for(let i=0;i<8;i++)set(size-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,size-15+i,bit(i));set(8,size-8,true);

/* Cetakan dicatat dulu di server (record_print) agar nomor SALINAN selalu benar,
   baru kemudian dikirim ke dialog cetak. */
async function printReceipt(s){
 const btn=$('#do-print'); busy(btn,true,'Menyiapkan…');
 let copy;
 try{copy=await apiRecordPrint(s);}catch(err){toast(friendlyError(err));busy(btn,false);return;}
 const paper=db.settings.paper;
 $('#page-size').textContent=`@media print{@page{size:${paperOf(paper).page} auto;margin:0}}`;
 $('#print-root').innerHTML=`<div class="thermal w${paper}">${receiptHTML(s,copy)}</div>`;
 s.print_count=copy+1;s.last_print=Date.now();
 try{window.print();}catch{}
 toast(inFrame?'Pratinjau memblokir dialog cetak. Buka web langsung di Chrome untuk mencetak.':'Nota dikirim ke dialog cetak.');
 refreshSales();receiptModal(s.id);
}

/* ---------- Modal umum ---------- */
function modal(title,sub,content,size=''){
 modal.prev=document.activeElement;
 $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="m-title"><header class="modal-head"><div><h2 id="m-title">${title}</h2><p>${sub}</p></div><button class="close" data-close aria-label="Tutup">×</button></header><div class="modal-body">${content}</div></section></div>`;
 $$('[data-close]',$('#modal-root')).forEach(b=>b.onclick=closeModal);
 $('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();};
 setTimeout(()=>($('input,select,textarea',$('#modal-root'))||$('.close',$('#modal-root')))?.focus(),20);
}
function closeModal(){$('#modal-root').innerHTML='';modal.prev?.focus?.();}
document.addEventListener('keydown',e=>{const r=$('#modal-root');if(!r.firstChild)return;if(e.key==='Escape')closeModal();
 if(e.key==='Tab'){const f=$$('button,input,select,textarea,a[href]',r).filter(x=>!x.disabled);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus();}}});

 const head=['nota','tanggal','kasir','pembeli','jumlah_bantal','harga_per_bantal','total','metode_bayar','status_kode','diaktifkan_pada','jumlah_cetak'];
 const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';
 const rows=filteredSales().map(s=>{const c=currentCode(s);return [s.invoice,fmtDT(s.created_at),userName(s.user_id),s.buyer,s.qty,s.unit_price,s.total,s.pay,{issued:'belum_aktif',active:'aktif',revoked:'dicabut',none:'tanpa_kode'}[c.status],c.activated_at?fmtDT(c.activated_at):'',s.print_count];});
 const csv='﻿'+[head,...rows].map(r=>r.map(cell).join(',')).join('\r\n');
 if(inFrame){navigator.clipboard?.writeText(csv).then(()=>toast('Pratinjau memblokir unduhan. CSV ('+rows.length+' baris) disalin ke clipboard.'),()=>toast('Unduhan diblokir di pratinjau. Buka web langsung di browser.'));return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='riwayat-penjualan-bdt.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('CSV diunduh, tanpa kode rahasia.');
}

/* ---------- Mulai ---------- */
async function boot(){
 if(!sb){$('#app').innerHTML=`<div class="loading-screen"><div style="max-width:360px;padding:16px">${errorBox('Gagal memuat pustaka Supabase. Periksa koneksi internet lalu muat ulang halaman.')}<button class="btn primary block" onclick="location.reload()">Muat ulang</button></div></div>`;return;}
 renderLoading('Memuat…');
 let err='';
 try{const {data:{session}}=await sb.auth.getSession();if(session)await startSession(session.user);}
 catch(e){err=friendlyError(e);}
 if(me())route();else renderLogin(err);
}
/* Sesi berakhir/keluar di tab lain → kembali ke halaman login. */
sb?.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'&&db.profile){db.profile=null;db.sales=[];closeModal();renderLogin('Sesi berakhir. Silakan masuk lagi.');}});
/* Saat tab dibuka kembali, ambil status kode terbaru (misal sudah diaktifkan pembeli). */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me()&&Date.now()-db.loadedAt>60000)reloadData(true);});
boot();
</script>
