/* QR encoder (versi 6, koreksi galat L, mode byte) — diambil dari referensi dosen. */
(function(root){
function multiply(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11d);z^=((y>>>i)&1)*x;}return z;}

function matrix(value){const bytes=new TextEncoder().encode(value);if(bytes.length>134)throw new Error('Isi QR terlalu panjang.');const bits=[];function add(n,len){for(let i=len-1;i>=0;i--)bits.push((n>>>i)&1);}
add(4,4);add(bytes.length,8);for(const b of bytes)add(b,8);add(0,Math.min(4,1088-bits.length));while(bits.length%8)bits.push(0);
const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>a*2+b,0));for(let pad=0;data.length<136;pad++)data.push(pad%2?0x11:0xec);
const blocks=[data.slice(0,68),data.slice(68)],ecc=blocks.map(b=>remainder(b,18)),words=[];for(let i=0;i<68;i++)for(const b of blocks)words.push(b[i]);for(let i=0;i<18;i++)for(const b of ecc)words.push(b[i]);
const size=41,m=Array.from({length:size},()=>Array(size).fill(false)),reserved=Array.from({length:size},()=>Array(size).fill(false));function set(x,y,v){m[y][x]=!!v;reserved[y][x]=true;}
for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
function finder(cx,cy){for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x>=0&&y>=0&&x<size&&y<size){const d=Math.max(Math.abs(dx),Math.abs(dy));set(x,y,d!==2&&d!==4);}}}
finder(3,3);finder(size-4,3);finder(3,size-4);
for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(34+dx,34+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
const format=0x77c4;const bit=i=>(format>>>i)&1;
for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));
for(let i=0;i<8;i++)set(size-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,size-15+i,bit(i));set(8,size-8,true);
let index=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++){const upward=((right+1)&2)===0,y=upward?size-1-vert:vert;for(let j=0;j<2;j++){const x=right-j;if(!reserved[y][x]){const dark=index<words.length*8?((words[index>>>3]>>>(7-(index&7)))&1)!==0:false;m[y][x]=dark!==((x+y)%2===0);index++;}}}}

root.BdtQR={matrix,svg};

const TZ='Asia/Jakarta', KEY='bdt-penjual-pratinjau-v1';
const ALPHABET='23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // tanpa 0, O, 1, I, L
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

function readStore(){try{return JSON.parse(localStorage.getItem(KEY));}catch{return memoryStore;}}
function writeStore(d){memoryStore=d;try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}}

function randomCode(){const r=crypto.getRandomValues(new Uint8Array(8));let s='';for(const n of r)s+=ALPHABET[n%ALPHABET.length];return 'BDT-'+s.slice(0,4)+'-'+s.slice(4);}
function uniqueCode(){let c;do{c=randomCode();}while(db.codes.some(x=>x.code===c));return c;}
const qrPayload=code=>'bdt://aktivasi?kode='+code;

function nextInvoice(t){const k=dayKey(t),n=db.sales.filter(s=>dayKey(s.created_at)===k).length+1;return (db.settings.prefix||'INV')+'-'+k.replace(/-/g,'')+'-'+String(n).padStart(4,'0');}
function insertSale(userId,{qty,unitPrice,buyer,pay,requestId},t=Date.now()){
 const s={id:uid(),invoice:nextInvoice(t),user_id:userId,qty,unit_price:unitPrice,total:qty*unitPrice,buyer:buyer||'',pay,request_id:requestId,created_at:t,print_count:0,last_print:null};
 db.sales.push(s);
 db.codes.push({id:uid(),sale_id:s.id,code:uniqueCode(),status:'issued',device_id:null,activated_at:null,created_at:t,reason:null});
 return s;
}
/* RPC create_sale: 1 transaksi = 1 kode aktivasi */
function apiCreateSale(input){
 const qty=Number(input.qty),price=Number(input.unitPrice);
 if(!Number.isInteger(qty)||qty<1||qty>500)throw new Error('Jumlah bantal harus angka bulat 1–500.');
 if(!Number.isFinite(price)||price<0||price>100000000)throw new Error('Harga per bantal tidak valid.');
 const dup=db.sales.find(s=>s.request_id===input.requestId); if(dup)return dup; // anti-dobel
 const s=insertSale(db.session,{qty,unitPrice:price,buyer:String(input.buyer||'').trim().slice(0,80),pay:input.pay,requestId:input.requestId});
 log('generate',s,currentCode(s).code.slice(-4)); save(); return s;
}
function apiReplaceCode(codeId,reason){
 if(!isAdmin())throw new Error('Hanya admin yang dapat menerbitkan kode pengganti.');
 const c=db.codes.find(x=>x.id===codeId); if(!c)throw new Error('Kode tidak ditemukan.');
 if(String(reason).trim().length<5)throw new Error('Tulis alasan minimal 5 karakter.');
 c.status='revoked';c.reason='Diganti: '+reason;
 const s=db.sales.find(x=>x.id===c.sale_id);
 db.codes.push({id:uid(),sale_id:s.id,code:uniqueCode(),status:'issued',device_id:null,activated_at:null,created_at:Date.now(),reason:null});
 log('ganti_kode',s,reason); save(); return s;
}
function apiRevokeCode(codeId,reason){
 if(!isAdmin())throw new Error('Hanya admin yang dapat mencabut kode.');
 const c=db.codes.find(x=>x.id===codeId); if(!c)throw new Error('Kode tidak ditemukan.');
 if(String(reason).trim().length<5)throw new Error('Tulis alasan minimal 5 karakter.');
 c.status='revoked';c.reason=reason; log('cabut',db.sales.find(x=>x.id===c.sale_id),reason); save();
}
/* RPC activate_code — yang nanti dipanggil aplikasi Flutter:
   supabase.rpc('activate_code', params: {'p_code': kode, 'p_device_id': idPerangkat}) */
const attempts={};
function apiActivate(rawCode,deviceId){
 const now=Date.now(); attempts[deviceId]=(attempts[deviceId]||[]).filter(t=>now-t<60000);
 if(attempts[deviceId].length>=10)return{http:429,body:{status:'rate_limited',message:'Terlalu banyak percobaan. Coba lagi 1 menit lagi.'}};
 let v=String(rawCode||'').trim(); const m=v.match(/kode=([A-Za-z0-9-]+)/); if(m)v=m[1];
 v=v.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.startsWith('BDT'))v=v.slice(3);
 const code=v.length===8?'BDT-'+v.slice(0,4)+'-'+v.slice(4):null;
 const c=code&&db.codes.find(x=>x.code===code);
 if(!c||c.status==='revoked'){attempts[deviceId].push(now);return{http:404,body:{status:'invalid',message:'Kode tidak ditemukan atau sudah dicabut.'}};}
 const s=db.sales.find(x=>x.id===c.sale_id);
 const ok=extra=>({http:200,body:{status:'ok',...extra,kode:c.code,nota:s.invoice,jumlah_bantal:s.qty,activated_at:new Date(c.activated_at).toISOString()}});
 if(c.status==='active'){return c.device_id===deviceId?ok({reactivated:true}):{http:409,body:{status:'used',message:'Kode sudah dipakai di perangkat lain.'}};}
 c.status='active';c.device_id=deviceId;c.activated_at=now; db.logs.push({id:uid(),t:now,user_id:null,action:'aktivasi',sale_id:s.id,detail:deviceId}); save();
 return ok({});
}

 const st=db.settings,c=currentCode(s);
 let codePart;
 if(c.status==='issued')codePart=`<div class="r-center r-label">KODE AKTIVASI</div><div class="r-code">${esc(c.code)}</div><div class="r-qr">${BdtQR.svg(qrPayload(c.code))}</div><div class="r-note">Buka aplikasi BDT, pilih Aktivasi,<br>lalu scan QR atau ketik kode di atas.<br>1 kode untuk 1 perangkat. Simpan nota ini.</div>`;
 else if(c.status==='active')codePart=`<div class="r-center r-label">KODE AKTIVASI</div><div class="r-note">Kode sudah diaktifkan pada ${fmtDT(c.activated_at)}.<br>Kode tidak dicetak ulang.</div>`;
 else codePart=`<div class="r-center r-label">KODE AKTIVASI</div><div class="r-note">Kode dicabut. Hubungi penjual.</div>`;
 return `<div class="r"><div class="r-center r-brand">◩ ${esc(st.shopName)}</div><div class="r-center">${esc(st.address)}<br>WA ${esc(st.phone)}</div>
 ${copy>0?`<div class="r-copy">SALINAN KE-${copy}</div>`:''}<hr>
 <div class="r-row"><span>No. Nota</span><span>${esc(s.invoice)}</span></div>
 <div class="r-row"><span>Tanggal</span><span>${fmtDT(s.created_at)}</span></div>
 <div class="r-row"><span>Kasir</span><span>${esc(userName(s.user_id))}</span></div>
 ${s.buyer?`<div class="r-row"><span>Pembeli</span><span>${esc(s.buyer)}</span></div>`:''}<hr>
 <div>Bantal BDT Merah Putih</div><div class="r-row"><span>${s.qty} x ${money(s.unit_price)}</span><span>${money(s.total)}</span></div><hr>
 <div class="r-row r-total"><span>TOTAL</span><span>${money(s.total)}</span></div><div class="r-row"><span>Bayar</span><span>${esc(s.pay)}</span></div>
 <hr class="double">${codePart}<hr><div class="r-center">${esc(st.footer)}</div></div>`;
}
function receiptModal(id,fresh=false){
 const s=db.sales.find(x=>x.id===id),c=currentCode(s),paper=db.settings.paper;
 modal(`Nota ${esc(s.invoice)}`,fresh?'Kode baru dibuat. Cetak dan berikan nota ke pembeli.':'Pratinjau nota printer thermal '+paper+' mm.',`
 <div class="receipt-layout"><div class="paper-wrap"><div class="paper w${paper}">${receiptHTML(s,s.print_count)}</div></div>
 <div><dl class="kv"><dt>Status</dt><dd>${statusPill(c.status)}</dd><dt>Bantal</dt><dd>${s.qty}</dd><dt>Total</dt><dd>${money(s.total)}</dd><dt>Dicetak</dt><dd>${s.print_count}×${s.last_print?' · terakhir '+fmtDT(s.last_print):''}</dd>${c.status==='active'?`<dt>Perangkat</dt><dd>${esc(c.device_id)}</dd>`:''}</dl>
 ${c.status==='issued'?`<div class="code-card"><div class="small muted">Kode aktivasi</div><code>${esc(c.code)}</code></div>`:''}
 ${s.print_count>0?`<div class="alert warn">Nota ini sudah pernah dicetak. Cetakan berikutnya bertanda <b>SALINAN KE-${s.print_count}</b> dan tercatat.</div>`:''}
 <div class="modal-actions" style="justify-content:flex-start">${c.status==='issued'?`<button class="btn" id="copy-code">${icon('copy')}Salin kode</button>`:''}<button class="btn primary" id="do-print">${icon('print')}${s.print_count>0?'Cetak salinan':'Cetak nota'}</button></div></div></div>`,'wide');
 $('#copy-code')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(c.code);toast('Kode disalin.');}catch{toast('Tidak bisa menyalin otomatis. Kode: '+c.code);}});
 $('#do-print').onclick=()=>printReceipt(s);
}
function printReceipt(s){
 const paper=db.settings.paper,copy=s.print_count;
 $('#page-size').textContent=`@media print{@page{size:${paper}mm auto;margin:0}}`;
 $('#print-root').innerHTML=`<div class="thermal w${paper}">${receiptHTML(s,copy)}</div>`;
 s.print_count++;s.last_print=Date.now();log(copy?'cetak_ulang':'cetak',s,'salinan '+copy);save();
 try{window.print();}catch{}
 toast(inFrame?'Pratinjau Claude memblokir dialog cetak. Buka file HTML ini langsung di Chrome untuk mencetak.':'Nota dikirim ke dialog cetak.');
 refreshSales();receiptModal(s.id);
}

/* ---------- Kelola kode (admin) ---------- */
function manageModal(id){
 const s=db.sales.find(x=>x.id===id),c=currentCode(s),hist=codesOf(s);
 modal('Kelola kode',`Nota ${esc(s.invoice)} · kode berakhir ${esc(c.code.slice(-4))}`,`
 <dl class="kv"><dt>Status</dt><dd>${statusPill(c.status)}</dd><dt>Perangkat</dt><dd>${esc(c.device_id||'—')}</dd><dt>Diaktifkan</dt><dd>${fmtDT(c.activated_at)}</dd><dt>Riwayat kode</dt><dd>${hist.length} kode${hist.length>1?' ('+(hist.length-1)+' diganti)':''}</dd></dl>
 <form id="manage-form"><div class="field"><label for="action">Tindakan</label><select id="action"><option value="replace">Terbitkan kode pengganti (misal pembeli ganti HP)</option>${c.status!=='revoked'?'<option value="revoke">Cabut kode (retur atau kode bocor)</option>':''}</select></div>
 <div class="alert warn">Kode lama langsung tidak berlaku. Periksa nota pembelian pembeli terlebih dahulu.</div>
 <div class="field"><label for="reason">Alasan</label><textarea id="reason" maxlength="200" required placeholder="Contoh: pembeli ganti HP, nota asli sudah diperiksa"></textarea></div>
 <div id="manage-error"></div><div class="modal-actions"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" type="submit">Simpan</button></div></form>`);
 $('#manage-form').onsubmit=e=>{e.preventDefault();try{if($('#action').value==='replace'){apiReplaceCode(c.id,$('#reason').value);refreshSales();receiptModal(s.id,true);toast('Kode pengganti dibuat. Cetak nota baru.');}
  else{apiRevokeCode(c.id,$('#reason').value);refreshSales();closeModal();toast('Kode dicabut.');}}catch(err){$('#manage-error').innerHTML=errorBox(err.message);}};
}

/* ---------- Simulasi aplikasi BDT (Flutter) ---------- */
function simModal(){
 modal('Uji aktivasi','Meniru halaman input kode di aplikasi BDT (Flutter).',`
 <div class="alert">Di aplikasi asli, kode dikirim ke fungsi aktivasi di Supabase. Di sini kodenya dicek ke data simulasi di browser ini.</div>
 <form id="sim-form"><div class="field"><label for="sim-code">Kode aktivasi atau isi QR</label><input id="sim-code" class="code" style="font-size:16px;text-transform:uppercase" autocomplete="off" spellcheck="false" placeholder="BDT-XXXX-XXXX" required></div>
 <div class="field"><label for="sim-dev">Perangkat</label><select id="sim-dev"><option value="HP-PEMBELI-A">HP pembeli A</option><option value="HP-PEMBELI-B">HP pembeli B</option></select><div class="hint">Coba aktifkan kode yang sama di HP A lalu HP B.</div></div>
 <button class="btn primary block" type="submit">${icon('check')}Aktifkan</button></form><div id="sim-out"></div>`);
 $('#sim-form').onsubmit=e=>{e.preventDefault();const code=$('#sim-code').value,dev=$('#sim-dev').value,r=apiActivate(code,dev);
  const msg={ok:r.body.reactivated?'Berhasil (perangkat yang sama, aktif kembali).':'Berhasil! Permainan terbuka di aplikasi.',used:'Ditolak: kode sudah dipakai di perangkat lain.',invalid:'Ditolak: kode tidak ditemukan.',rate_limited:'Ditolak: terlalu banyak percobaan.'}[r.body.status];
  $('#sim-out').innerHTML=`<div class="${r.http===200?'alert':'error'}" style="margin-top:14px">${esc(msg)}</div><pre class="json">→ activate_code\n${esc(JSON.stringify({p_code:code.trim(),p_device_id:dev},null,1))}\n\n← ${r.http}\n${esc(JSON.stringify(r.body,null,1))}</pre>`;
  if(r.http===200&&me()&&ui.view==='penjualan')refreshSales();};
}

/* ---------- Pengaturan (admin) ---------- */
function settingsView(){const s=db.settings;
 return `<div class="page-heading"><div><h1>Pengaturan</h1><p class="muted">Info toko, harga, nota, dan akun penjual.</p></div></div>
 <div class="row-two"><section class="panel"><div class="panel-head"><h2>Toko & nota</h2>${icon('print')}</div>
 <form id="set-form" class="panel-body">
  <div class="field"><label for="s-name">Nama toko</label><input id="s-name" maxlength="40" value="${esc(s.shopName)}" required></div>
  <div class="form-row"><div class="field"><label for="s-addr">Kota / alamat</label><input id="s-addr" maxlength="60" value="${esc(s.address)}"></div><div class="field"><label for="s-phone">No. WhatsApp</label><input id="s-phone" maxlength="20" value="${esc(s.phone)}"></div></div>
  <div class="form-row"><div class="field"><label for="s-price">Harga per bantal (Rp)</label><input id="s-price" type="number" min="0" step="500" value="${s.price}" required></div>
  <div class="field"><label for="s-paper">Lebar kertas nota</label><select id="s-paper"><option value="58" ${s.paper==58?'selected':''}>58 mm</option><option value="80" ${s.paper==80?'selected':''}>80 mm</option></select></div></div>
  <div class="field"><label for="s-prefix">Awalan nomor nota</label><input id="s-prefix" maxlength="6" value="${esc(s.prefix)}" pattern="[A-Za-z0-9]+"><div class="hint">Contoh hasil: ${esc(s.prefix)}-${dayKey(Date.now()).replace(/-/g,'')}-0001</div></div>
  <div class="field"><label for="s-footer">Teks penutup nota</label><input id="s-footer" maxlength="80" value="${esc(s.footer)}"></div>
  <div id="set-error"></div><button class="btn primary" type="submit">Simpan pengaturan</button></form></section>
 <div><section class="panel" style="margin-bottom:22px"><div class="panel-head"><div><h2>Akun penjual</h2><p>Penjual hanya melihat penjualannya sendiri.</p></div></div>
  <div class="panel-body"><div id="users"></div>
  <form id="user-form" style="margin-top:16px"><div class="form-row"><div class="field"><label for="u-name">Nama</label><input id="u-name" maxlength="40" required></div><div class="field"><label for="u-email">Email</label><input id="u-email" type="email" maxlength="80" required></div></div>
  <div id="user-error"></div><button class="btn" type="submit">${icon('plus')}Tambah penjual</button></form></div></section>
 <section class="panel"><div class="panel-head"><h2>Data simulasi</h2></div><div class="panel-body"><p class="small muted">Kembalikan data contoh seperti semula. Hanya ada di pratinjau.</p><button class="btn danger" id="reset">Atur ulang data simulasi</button></div></section></div></div>`;}
function renderUsers(){$('#users').innerHTML=db.users.map(u=>`<div class="user-row"><div><b>${esc(u.name)}</b><span class="muted">${esc(u.email)} · ${u.role==='admin'?'Admin':'Penjual'}</span></div>
 ${u.id===db.session?'<span class="pill">Anda</span>':`<button class="btn sm ${u.active?'':'primary'}" data-toggle="${u.id}">${u.active?'Nonaktifkan':'Aktifkan'}</button>`}</div>`).join('');
 $$('[data-toggle]').forEach(b=>b.onclick=()=>{const u=db.users.find(x=>x.id===b.dataset.toggle);u.active=!u.active;save();renderUsers();toast(u.name+(u.active?' diaktifkan.':' dinonaktifkan.'));});}
function bindSettings(){
 renderUsers();
 $('#set-form').onsubmit=e=>{e.preventDefault();const price=Number($('#s-price').value),prefix=$('#s-prefix').value.trim().toUpperCase();
  if(!$('#s-name').value.trim())return $('#set-error').innerHTML=errorBox('Nama toko wajib diisi.');
  if(!Number.isFinite(price)||price<0)return $('#set-error').innerHTML=errorBox('Harga tidak valid.');
  if(!/^[A-Z0-9]{1,6}$/.test(prefix))return $('#set-error').innerHTML=errorBox('Awalan nota hanya huruf/angka, maksimal 6.');
  Object.assign(db.settings,{shopName:$('#s-name').value.trim(),address:$('#s-addr').value.trim(),phone:$('#s-phone').value.trim(),price,paper:Number($('#s-paper').value),prefix,footer:$('#s-footer').value.trim()});
  save();render();toast('Pengaturan disimpan.');};
 $('#user-form').onsubmit=e=>{e.preventDefault();const name=$('#u-name').value.trim(),email=$('#u-email').value.trim().toLowerCase();
  if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return $('#user-error').innerHTML=errorBox('Isi nama dan email yang valid.');
  if(db.users.some(u=>u.email===email))return $('#user-error').innerHTML=errorBox('Email sudah terdaftar.');
  db.users.push({id:uid(),name,email,role:'penjual',active:true});save();e.target.reset();$('#user-error').innerHTML='';renderUsers();toast('Penjual ditambahkan. Di versi asli, undangan dikirim lewat email.');};
 $('#reset').onclick=()=>modal('Atur ulang data?','Semua transaksi simulasi diganti data contoh.',`<div class="modal-actions"><button class="btn" data-close>Batal</button><button class="btn danger" id="confirm-reset">Atur ulang</button></div>`)||($('#confirm-reset').onclick=()=>{const sess=db.session;seed();db.session=db.users.some(u=>u.id===sess)?sess:null;save();closeModal();location.hash='penjualan';route();toast('Data simulasi diatur ulang.');});
}

/* ---------- Modal umum ---------- */
function modal(title,sub,content,size=''){
 modal.prev=document.activeElement;
 $('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="m-title"><header class="modal-head"><div><h2 id="m-title">${title}</h2><p>${sub}</p></div><button class="close" data-close aria-label="Tutup">×</button></header><div class="modal-body">${content}</div></section></div>`;
 $$('[data-close]',$('#modal-root')).forEach(b=>b.onclick=closeModal);
 $('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();};
 setTimeout(()=>($('input,select,textarea',$('#modal-root'))||$('.close',$('#modal-root')))?.focus(),20);
}
function closeModal(){$('#modal-root').innerHTML='';modal.prev?.focus?.();}
document.addEventListener('keydown',e=>{const r=$('#modal-root');if(!r.firstChild)return;if(e.key==='Escape')closeModal();
 if(e.key==='Tab'){const f=$$('button,input,select,textarea,a[href]',r).filter(x=>!x.disabled);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus();}}});

function helpModal(){modal('Bantuan','Panduan singkat untuk penjual.',`<div class="help">
 <h3>Saat ada pembeli</h3><ol><li>Isi <b>jumlah bantal</b> yang dibeli. Harga terisi otomatis.</li><li>Nama pembeli boleh dikosongkan. Jangan isi data anak.</li><li>Tekan <b>Simpan & buat kode</b>. Satu transaksi mendapat satu kode.</li><li>Tekan <b>Cetak nota</b>, lalu berikan nota ke pembeli.</li><li>Pembeli membuka aplikasi BDT, memilih Aktivasi, lalu scan QR di nota.</li></ol>
 <h3>Jika ada masalah</h3><ol><li><b>Nota hilang atau rusak:</b> buka riwayat, tekan Nota, lalu cetak salinan. Kode yang sudah aktif tidak dicetak ulang.</li><li><b>Pembeli ganti HP:</b> admin menekan Kelola, lalu terbitkan kode pengganti setelah memeriksa nota.</li><li><b>Retur atau kode bocor:</b> admin mencabut kode dengan alasan.</li></ol></div>`);}
function accountModal(){const u=me();modal(esc(u.name),esc(u.email)+' · '+(u.role==='admin'?'Admin':'Penjual'),`<div class="alert">Sesi login berlaku di perangkat ini.</div><div class="modal-actions"><button class="btn" data-close>Tutup</button><button class="btn danger" id="logout">${icon('logout')}Keluar</button></div>`);
 $('#logout').onclick=()=>{db.session=null;save();closeModal();history.replaceState(null,'',location.pathname);render();};}

function exportCSV(){
 const head=['nota','tanggal','kasir','pembeli','jumlah_bantal','harga_per_bantal','total','metode_bayar','status_kode','diaktifkan_pada','jumlah_cetak'];
 const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';
 const rows=filteredSales().map(s=>{const c=currentCode(s);return [s.invoice,fmtDT(s.created_at),userName(s.user_id),s.buyer,s.qty,s.unit_price,s.total,s.pay,{issued:'belum_aktif',active:'aktif',revoked:'dicabut'}[c.status],c.activated_at?fmtDT(c.activated_at):'',s.print_count];});
 const csv='﻿'+[head,...rows].map(r=>r.map(cell).join(',')).join('\r\n');
 if(inFrame){navigator.clipboard?.writeText(csv).then(()=>toast('Pratinjau Claude memblokir unduhan. CSV ('+rows.length+' baris) disalin ke clipboard.'),()=>toast('Unduhan diblokir di pratinjau. Buka file HTML langsung di browser.'));return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='riwayat-penjualan-bdt.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('CSV diunduh, tanpa kode rahasia.');
}

route();
</script>
